name: Monitor Hanikorekhar Repository

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 安装必要工具
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: 恢复缓存状态
        uses: actions/cache@v3
        with:
          path: |
            .github/monitor_state
          key: monitor-state-${{ github.ref }}-${{ github.run_id }}
          restore-keys: |
            monitor-state-${{ github.ref }}-

      - name: 检查仓库更新
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          echo "=== 监控脚本开始 ==="
          
          OWNER="pvtvampy"
          REPO="pantry-core"
          STATE_DIR=".github/monitor_state"
          LAST_COMMIT_FILE="$STATE_DIR/last_commit.txt"
          LAST_VERSION_FILE="$STATE_DIR/last_version.txt"
          
          mkdir -p "$STATE_DIR"
          
          # 获取最新提交
          LATEST_COMMIT=$(curl -s "https://api.github.com/repos/$OWNER/$REPO/commits/main")
          CURRENT_SHA=$(echo "$LATEST_COMMIT" | jq -r '.sha')
          echo "当前提交: $CURRENT_SHA"
          
          # 获取更新的文件列表
          COMMIT_DETAIL=$(curl -s "https://api.github.com/repos/$OWNER/$REPO/commits/$CURRENT_SHA")
          FILES=$(echo "$COMMIT_DETAIL" | jq -r '.files[].filename' 2>/dev/null | tr '\n' ' ' || echo "")
          echo "涉及文件: $FILES"
          
          # 获取并解析版本文件
          VERSION_URL="https://raw.githubusercontent.com/$OWNER/$REPO/main/SrcVersion.ini"
          VERSION_CONTENT=$(curl -s "$VERSION_URL" || echo "")
          
          STABLE_VER=$(echo "$VERSION_CONTENT" | grep "Release_channel" | cut -d'=' -f2 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          BETA_VER=$(echo "$VERSION_CONTENT" | grep "Dev_channel"   | cut -d'=' -f2 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          
          echo "解析稳定版: '$STABLE_VER'"
          echo "解析测试版: '$BETA_VER'"
          
          # 初始化：首次运行或状态文件缺失
          if [ ! -f "$LAST_COMMIT_FILE" ] || [ ! -f "$LAST_VERSION_FILE" ]; then
            echo "初始化：保存当前状态。"
            echo "$CURRENT_SHA" > "$LAST_COMMIT_FILE"
            echo "$STABLE_VER|$BETA_VER" > "$LAST_VERSION_FILE"
            
            INIT_MSG="🔧 仓库监控已启动\n稳定版本: $STABLE_VER\n测试版本: $BETA_VER"
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\": \"$CHAT_ID\", \"text\": \"$INIT_MSG\"}"
            
            echo "✅ 初始状态已保存，启动通知已发送。"
            echo "=== 监控脚本结束 ==="
            exit 0
          fi
          
          # 读取上次保存的状态
          LAST_SHA=$(cat "$LAST_COMMIT_FILE" 2>/dev/null || echo "")
          LAST_VER_DATA=$(cat "$LAST_VERSION_FILE" 2>/dev/null || echo "|")
          OLD_STABLE=$(echo "$LAST_VER_DATA" | cut -d'|' -f1)
          OLD_BETA=$(echo "$LAST_VER_DATA" | cut -d'|' -f2)
          
          echo "上次提交: $LAST_SHA"
          echo "上次稳定: '$OLD_STABLE'"
          echo "上次测试: '$OLD_BETA'"
          
          # ========== 【核心修复与调试块】 ==========
          echo ">>> 开始执行误报修复逻辑 <<<"
          
          # 1. 自动修正旧版本记录中的明显错误
          if [[ -z "$OLD_STABLE" || "$OLD_STABLE" == "|" || "$OLD_STABLE" == *" → "* ]]; then
              echo "⚠️  修复：旧稳定版记录异常 ('$OLD_STABLE')，已覆盖为当前值 ('$STABLE_VER')。"
              OLD_STABLE="$STABLE_VER"
          fi
          if [[ -z "$OLD_BETA" || "$OLD_BETA" == "|" || "$OLD_BETA" == *" → "* ]]; then
              echo "⚠️  修复：旧测试版记录异常 ('$OLD_BETA')，已覆盖为当前值 ('$BETA_VER')。"
              OLD_BETA="$BETA_VER"
          fi
          
          # 2. 严格校验新解析出的版本号是否有效
          SKIP_VERSION_CHECK=false
          if [[ -z "$STABLE_VER" || -z "$BETA_VER" ]]; then
              echo "⚠️  警告：解析出的新版本号为空，跳过版本比对以防止误报。"
              SKIP_VERSION_CHECK=true
          elif echo "$STABLE_VER"$'\n'"$BETA_VER" | grep -q "→"; then
              echo "⚠️  警告：解析出的版本号包含通知符号 '→'，文件可能被意外修改，跳过比对。"
              SKIP_VERSION_CHECK=true
          fi
          
          # 3. 关键调试信息：打印修复和校验后的最终比对值
          echo "[调试] 最终比对值："
          echo "  OLD_STABLE = '$OLD_STABLE'"
          echo "  STABLE_VER = '$STABLE_VER'"
          echo "  OLD_BETA   = '$OLD_BETA'"
          echo "  BETA_VER   = '$BETA_VER'"
          echo "  版本比对是否被跳过: $SKIP_VERSION_CHECK"
          echo ">>> 误报修复逻辑执行完毕 <<<"
          # ========== 【核心修复与调试块结束】 ==========
          
          # 检测新提交
          if [ "$CURRENT_SHA" != "$LAST_SHA" ] && [ -n "$LAST_SHA" ]; then
            echo "🚨 发现新提交，开始分析..."
            NOTIFICATION=""
            HAS_STABLE_SO_UPDATE=false
            HAS_BETA_SO_UPDATE=false

            for FILE in $FILES; do
              case "$FILE" in
                "client/IllI.exe")
                  NOTIFICATION+="模拟器加载器已更新\n"
                  ;;
                "lib/4.2/libvampy64.so")
                  HAS_STABLE_SO_UPDATE=true
                  NOTIFICATION+="直装已更新\n"
                  ;;
                "lib/4.2/libvampyb64.so")
                  HAS_BETA_SO_UPDATE=true
                  NOTIFICATION+="测试版已更新\n"
                  ;;
              esac
            done

            # 稳定版本检查
            VERSION_NOTIFICATION=""
            if [ "$SKIP_VERSION_CHECK" = false ] && [ -n "$STABLE_VER" ] && [ -n "$OLD_STABLE" ]; then
              if [ "$STABLE_VER" != "$OLD_STABLE" ]; then
                echo "稳定版本变化: $OLD_STABLE -> $STABLE_VER"
                if [ -n "$NOTIFICATION" ]; then
                  VERSION_NOTIFICATION+="\n"
                fi
                if [ "$HAS_STABLE_SO_UPDATE" = true ]; then
                  VERSION_NOTIFICATION+="稳定通道更新:\n$OLD_STABLE → $STABLE_VER\n"
                else
                  VERSION_NOTIFICATION+="稳定更新版本号: $OLD_STABLE → $STABLE_VER\n"
                fi
              fi
            fi

            # 测试版本检查
            if [ "$SKIP_VERSION_CHECK" = false ] && [ -n "$BETA_VER" ] && [ -n "$OLD_BETA" ]; then
              if [ "$BETA_VER" != "$OLD_BETA" ]; then
                echo "测试版本变化: $OLD_BETA -> $BETA_VER"
                if [ -n "$NOTIFICATION" ] || [ -n "$VERSION_NOTIFICATION" ]; then
                  VERSION_NOTIFICATION+="\n"
                fi
                if [ "$HAS_BETA_SO_UPDATE" = true ]; then
                  VERSION_NOTIFICATION+="测试通道更新:\n$OLD_BETA → $BETA_VER\n"
                else
                  VERSION_NOTIFICATION+="测试更新版本号: $OLD_BETA → $BETA_VER\n"
                fi
              fi
            fi
            
            # 合并文件更新和版本更新通知
            if [ -n "$VERSION_NOTIFICATION" ]; then
              NOTIFICATION="$NOTIFICATION$VERSION_NOTIFICATION"
            fi
            
            # 发送通知（如果有内容）
            if [ -n "$NOTIFICATION" ]; then
              echo "📤 发送通知..."
              echo "通知内容预览："
              echo "$NOTIFICATION"
              curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
                -H "Content-Type: application/json" \
                -d "{\"chat_id\": \"$CHAT_ID\", \"text\": \"$NOTIFICATION\"}"
              echo "✅ 通知已发送。"
            else
              echo "ℹ️  新提交未包含监控目标，本次静默。"
            fi
            
            # 更新状态文件
            echo "$CURRENT_SHA" > "$LAST_COMMIT_FILE"
            if [ "$SKIP_VERSION_CHECK" = false ]; then
                echo "$STABLE_VER|$BETA_VER" > "$LAST_VERSION_FILE"
                echo "状态（提交及版本）已更新。"
            else
                echo "状态（仅提交）已更新，版本记录因无效而保持原样。"
            fi
            
          else
            echo "✅ 已是最新状态，无新提交。"
          fi
          
          echo "=== 监控脚本结束 ==="
