name: 监控 Hanikorekhar 仓库（稳定版）

on:
  schedule:
    - cron: '*/5 * * * *' # 注意：GitHub Actions的cron有延迟，是正常现象
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 安装必要工具
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: 2. 恢复监控状态缓存
        uses: actions/cache@v3
        with:
          path: .github/monitor_state
          key: monitor-state-${{ github.ref }}
          restore-keys: monitor-state-${{ github.ref }}-

      - name: 3. 执行监控（基于文件哈希）
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          echo "=== 基于文件哈希的监控脚本开始 ==="
          OWNER="vampycloudia"
          REPO="hanikorekhar"
          STATE_DIR=".github/monitor_state"
          mkdir -p "$STATE_DIR"

          # 定义监控目标和对应的状态文件
          declare -A FILE_MAP
          FILE_MAP["IllI.exe"]="$STATE_DIR/hash_IllI.exe"
          FILE_MAP["lib/libvampy64.so"]="$STATE_DIR/hash_libvampy64.so"
          FILE_MAP["lib/libvampyb64.so"]="$STATE_DIR/hash_libvampyb64.so"
          FILE_MAP["SrcVersion.ini"]="$STATE_DIR/hash_SrcVersion.ini"

          NOTIFICATION="" # 初始化通知内容
          ANY_FILE_CHANGED=false # 标记是否有文件发生变化

          # ========== 循环检查每个关键文件 ==========
          for FILE_PATH in "${!FILE_MAP[@]}"; do
            HASH_FILE=${FILE_MAP[$FILE_PATH]}
            echo "--- 检查文件: $FILE_PATH ---"

            # 获取文件当前内容的哈希值 (使用MD5)
            CURRENT_HASH=$(curl -s -f "https://raw.githubusercontent.com/$OWNER/$REPO/main/$FILE_PATH" | md5sum | cut -d' ' -f1 2>/dev/null)
            
            if [ -z "$CURRENT_HASH" ]; then
              echo "  跳过：无法获取文件或内容为空。"
              continue
            fi

            echo "  当前哈希: $CURRENT_HASH"

            # 读取上次保存的哈希值
            if [ -f "$HASH_FILE" ]; then
              LAST_HASH=$(cat "$HASH_FILE")
              echo "  上次哈希: $LAST_HASH"
            else
              LAST_HASH=""
              echo "  上次哈希: (无记录，首次运行)"
            fi

            # 比对哈希值
            if [ "$CURRENT_HASH" != "$LAST_HASH" ]; then
              echo "  🚨 检测到文件内容变化！"
              ANY_FILE_CHANGED=true
              
              # 根据文件路径构建通知消息
              case "$FILE_PATH" in
                "IllI.exe")
                  NOTIFICATION+="🔄 模拟器加载器已更新\n"
                  ;;
                "lib/libvampy64.so")
                  NOTIFICATION+="✅ 直装（稳定通道）已更新\n"
                  ;;
                "lib/libvampyb64.so")
                  NOTIFICATION+="🧪 测试版已更新\n"
                  ;;
                "SrcVersion.ini")
                  # 如果是版本文件，解析并通知具体版本号
                  VERSION_CONTENT=$(curl -s "https://raw.githubusercontent.com/$OWNER/$REPO/main/$FILE_PATH")
                  STABLE_VER=$(echo "$VERSION_CONTENT" | grep -i "release_channel" | cut -d'=' -f2 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
                  BETA_VER=$(echo "$VERSION_CONTENT" | grep -i "dev_channel" | cut -d'=' -f2 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
                  NOTIFICATION+="📦 版本文件已更新"
                  if [ -n "$STABLE_VER" ] || [ -n "$BETA_VER" ]; then
                    NOTIFICATION+="\n  稳定版: $STABLE_VER\n  测试版: $BETA_VER"
                  fi
                  NOTIFICATION+="\n"
                  ;;
              esac
              
              # 更新哈希记录
              echo "$CURRENT_HASH" > "$HASH_FILE"
              echo "  哈希状态已更新。"
            else
              echo "  文件未变化。"
            fi
            echo ""
          done

          # ========== 根据检查结果决定是否发送通知 ==========
          if [ "$ANY_FILE_CHANGED" = true ] && [ -n "$NOTIFICATION" ]; then
            echo "📤 发现更新，准备发送通知..."
            echo "--- 通知内容 ---"
            echo -e "$NOTIFICATION"
            echo "----------------"
            
            # 发送Telegram通知
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
              -H "Content-Type: application/json" \
              -d "{\"chat_id\": \"$CHAT_ID\", \"text\": \"$NOTIFICATION\"}"
            
            echo "✅ 通知已发送。"
          else
            echo "✅ 所有监控文件均无变化，本次静默。"
          fi

          echo "=== 监控脚本结束 ==="
