name: 监控 Hanikorekhar 仓库更新

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 安装必要工具
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: 2. 恢复监控状态缓存
        uses: actions/cache@v3
        with:
          path: .github/monitor_state
          key: monitor-state-${{ github.ref }}
          restore-keys: monitor-state-${{ github.ref }}

      - name: 3. 执行核心监控
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          echo "=== 监控脚本开始 ==="
          
          OWNER="vampycloudia"
          REPO="hanikorekhar"
          STATE_DIR=".github/monitor_state"
          mkdir -p "$STATE_DIR"
          LAST_COMMIT_FILE="$STATE_DIR/last_commit.txt"
          LAST_VERSION_FILE="$STATE_DIR/last_version.txt"
          
          # ========== 获取最新提交SHA ==========
          echo "步骤1: 获取最新提交..."
          API_RAW_RESPONSE=$(curl -s -w "HTTP_STATUS_CODE:%{http_code}" "https://api.github.com/repos/$OWNER/$REPO/commits/main")
          HTTP_CODE=$(echo "$API_RAW_RESPONSE" | sed -n 's/.*HTTP_STATUS_CODE:\([0-9]*\)$/\1/p')
          RESPONSE_BODY=$(echo "$API_RAW_RESPONSE" | sed 's/HTTP_STATUS_CODE:[0-9]*$//')
          
          FIRST_CHAR=$(echo -n "$RESPONSE_BODY" | head -c 1)
          if [ "$FIRST_CHAR" != "{" ]; then
              echo "❌ 错误：API响应不是有效JSON。可能是网络问题，请稍后重试。"
              exit 1
          fi
          
          CURRENT_SHA=$(echo "$RESPONSE_BODY" | jq -e -r '.sha' 2>&1)
          if [ $? -ne 0 ] || [ -z "$CURRENT_SHA" ]; then
              echo "❌ 错误：无法解析提交SHA。原始响应开头："
              echo "$RESPONSE_BODY" | head -c 200
              exit 1
          fi
          echo "  当前提交SHA: $CURRENT_SHA"
          
          # ========== 获取更新文件列表 ==========
          echo "步骤2: 获取更新的文件列表..."
          COMMIT_DETAIL=$(curl -s "https://api.github.com/repos/$OWNER/$REPO/commits/$CURRENT_SHA")
          FILES=$(echo "$COMMIT_DETAIL" | jq -r '.files[].filename // empty' 2>/dev/null | tr '\n' ' ')
          echo "  涉及文件: $FILES"
          
          # ========== 【核心修复】解析并验证版本信息 ==========
          echo "步骤3: 解析并验证版本信息..."
          VERSION_URL="https://raw.githubusercontent.com/$OWNER/$REPO/main/SrcVersion.ini"
          VERSION_CONTENT=$(curl -s "$VERSION_URL" || echo "")
          
          # 提取版本号，并去除所有空白字符
          STABLE_VER=$(echo "$VERSION_CONTENT" | grep -i "release_channel" | cut -d'=' -f2 | tr -d '[:space:]')
          BETA_VER=$(echo "$VERSION_CONTENT" | grep -i "dev_channel" | cut -d'=' -f2 | tr -d '[:space:]')
          
          # 关键校验：检查版本号是否有效（非空且稳定版不应包含‘Test’）
          VERSION_VALID=true
          if [ -z "$STABLE_VER" ] || [ -z "$BETA_VER" ]; then
              echo "⚠️  警告：版本号解析结果为空，可能文件格式错误。"
              echo "  稳定版: '$STABLE_VER'"
              echo "  测试版: '$BETA_VER'"
              VERSION_VALID=false
          fi
          
          # 额外提示：如果稳定版包含‘Test’字样，这通常是错误
          if echo "$STABLE_VER" | grep -qi "test"; then
              echo "⚠️  警告：稳定版版本号 '$STABLE_VER' 包含 'Test' 字样，这不符合常规。"
          fi
          
          echo "  解析结果 - 稳定版: '$STABLE_VER', 测试版: '$BETA_VER'"
          
          # ========== 初始化状态文件 ==========
          if [ ! -f "$LAST_COMMIT_FILE" ] || [ ! -f "$LAST_VERSION_FILE" ]; then
              echo "步骤4: 首次运行，初始化状态..."
              echo "$CURRENT_SHA" > "$LAST_COMMIT_FILE"
              echo "$STABLE_VER|$BETA_VER" > "$LAST_VERSION_FILE"
              INIT_MSG="🔧 仓库监控已启动\n稳定版本: $STABLE_VER\n测试版本: $BETA_VER"
              curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
                -H "Content-Type: application/json" \
                -d "{\"chat_id\": \"$CHAT_ID\", \"text\": \"$INIT_MSG\"}"
              echo "✅ 初始化完成并已发送启动通知。"
              exit 0
          fi
          
          # ========== 读取上次状态 ==========
          LAST_SHA=$(cat "$LAST_COMMIT_FILE" 2>/dev/null || echo "")
          LAST_VER_DATA=$(cat "$LAST_VERSION_FILE" 2>/dev/null || echo "|")
          OLD_STABLE=$(echo "$LAST_VER_DATA" | cut -d'|' -f1)
          OLD_BETA=$(echo "$LAST_VER_DATA" | cut -d'|' -f2)
          echo "步骤4: 比对状态 (上次提交: $LAST_SHA)"
          echo "  上次版本 - 稳定: '$OLD_STABLE', 测试: '$OLD_BETA'"
          
          # ========== 核心：检测是否有相关更新 ==========
          if [ "$CURRENT_SHA" != "$LAST_SHA" ] && [ -n "$LAST_SHA" ]; then
              echo "🚨 发现新提交，分析更新..."
              
              NOTIFICATION=""
              HAS_STABLE_SO_UPDATE=false
              HAS_BETA_SO_UPDATE=false
              
              # 检查是否有监控的文件更新
              for FILE in $FILES; do
                  case "$FILE" in
                      "IllI.exe")
                          HAS_STABLE_SO_UPDATE=true
                          ;;
                      "lib/libvampy64.so")
                          HAS_STABLE_SO_UPDATE=true
                          ;;
                      "lib/libvampyb64.so")
                          HAS_BETA_SO_UPDATE=true
                          ;;
                  esac
              done
              
              # 【核心修复】仅在版本号有效时才进行比对和通知
              if [ "$VERSION_VALID" = true ]; then
                  # 检查版本号是否有真实变化
                  STABLE_VER_CHANGED=false
                  BETA_VER_CHANGED=false
                  
                  if [ -n "$STABLE_VER" ] && [ -n "$OLD_STABLE" ] && [ "$STABLE_VER" != "$OLD_STABLE" ]; then
                      STABLE_VER_CHANGED=true
                  fi
                  if [ -n "$BETA_VER" ] && [ -n "$OLD_BETA" ] && [ "$BETA_VER" != "$OLD_BETA" ]; then
                      BETA_VER_CHANGED=true
                  fi
                  
                  # 关键判断：只有监控的文件有更新 或 版本号真实变化 才通知
                  if [ "$HAS_STABLE_SO_UPDATE" = true ] || [ "$HAS_BETA_SO_UPDATE" = true ] || [ "$STABLE_VER_CHANGED" = true ] || [ "$BETA_VER_CHANGED" = true ]; then
                      
                      # 构建文件更新消息
                      if [ "$HAS_STABLE_SO_UPDATE" = true ]; then
                          NOTIFICATION+="直装已更新\n"
                      fi
                      if [ "$HAS_BETA_SO_UPDATE" = true ]; then
                          NOTIFICATION+="测试版已更新\n"
                      fi
                      
                      # 构建版本更新消息
                      if [ "$STABLE_VER_CHANGED" = true ]; then
                          if [ -n "$NOTIFICATION" ]; then
                              NOTIFICATION+="\n"
                          fi
                          NOTIFICATION+="稳定更新版本号: $OLD_STABLE → $STABLE_VER\n"
                      fi
                      if [ "$BETA_VER_CHANGED" = true ]; then
                          if [ -n "$NOTIFICATION" ]; then
                              NOTIFICATION+="\n"
                          fi
                          NOTIFICATION+="测试更新版本号: $OLD_BETA → $BETA_VER\n"
                      fi
                      
                      # 发送通知
                      echo "📤 发送通知..."
                      echo "--- 通知内容 ---"
                      echo -e "$NOTIFICATION"
                      echo "----------------"
                      curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
                        -H "Content-Type: application/json" \
                        -d "{\"chat_id\": \"$CHAT_ID\", \"text\": \"$NOTIFICATION\"}"
                  else
                      echo "ℹ️  新提交未包含任何监控文件更新，且版本号无变化，本次完全静默。"
                  fi
              else
                  echo "⚠️  版本信息无效，跳过版本比对。仅检查文件更新..."
                  # 即使版本无效，文件有更新仍通知
                  if [ "$HAS_STABLE_SO_UPDATE" = true ] || [ "$HAS_BETA_SO_UPDATE" = true ]; then
                      if [ "$HAS_STABLE_SO_UPDATE" = true ]; then NOTIFICATION+="直装已更新\n"; fi
                      if [ "$HAS_BETA_SO_UPDATE" = true ]; then NOTIFICATION+="测试版已更新\n"; fi
                      echo "📤 仅发送文件更新通知..."
                      curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
                        -H "Content-Type: application/json" \
                        -d "{\"chat_id\": \"$CHAT_ID\", \"text\": \"$NOTIFICATION\"}"
                  else
                      echo "ℹ️  新提交未包含任何监控文件更新，本次完全静默。"
                  fi
              fi
              
              # 更新状态文件（无论是否通知）
              echo "$CURRENT_SHA" > "$LAST_COMMIT_FILE"
              # 【重要】只有在版本有效时才更新版本记录，防止记录错误数据
              if [ "$VERSION_VALID" = true ]; then
                  echo "$STABLE_VER|$BETA_VER" > "$LAST_VERSION_FILE"
              fi
              echo "✅ 状态已更新。"
              
          else
              echo "✅ 已是最新状态，无新提交。"
          fi
          
          echo "=== 监控脚本结束 ==="
